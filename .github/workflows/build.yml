name: Build GhostShare APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

          - name: Debug layout
        run: |
          echo "=== root ==="; ls -la
          echo "=== app ==="; ls -la app || echo "NO app DIR"
          echo "=== settings.gradle.kts ==="; cat settings.gradle.kts || true
          echo "=== app/build.gradle.kts ==="; head -25 app/build.gradle.kts || echo "NO app/build.gradle.kts"
          echo "=== gradle projects ==="; gradle projects --stacktrace --warning-mode all || true

           - name: Build with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --warning-mode all
          else
            gradle assembleDebug --stacktrace --warning-mode all
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: GhostShare-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
