name: Build GhostShare APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Debug layout
        run: |
          echo "=== root ==="; ls -la
          echo "=== app ==="; ls -la app || echo "NO app DIR"
          echo "=== settings.gradle.kts ==="; cat settings.gradle.kts || true
          echo "=== app/build.gradle.kts ==="; head -25 app/build.gradle.kts || echo "NO app/build.gradle.kts"
          echo "=== gradle projects ==="; gradle projects --stacktrace --warning-mode all || true

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build with Gradle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --stacktrace --warning-mode all
          else
            gradle assembleRelease --stacktrace --warning-mode all
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v6
        with:
          name: GhostShare-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
